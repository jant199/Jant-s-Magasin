<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf2">
  <title>Tuft & Create ♡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="site" id="site" aria-label="Tuft & Create handmade studio">
    <!-- The original artwork is shown once only. Invisible hotspots provide interaction without duplicating icons. -->
    <img class="artwork" src="Assets/original-ui.png" alt="Tuft & Create — illustration originale du studio de tufting" width="1470" height="1070">
    <div id="translationLayer" class="translation-layer" aria-live="polite"></div>
    <button class="hotspot language" data-action="language" aria-label="Change language" title="Change language"></button>
    <button class="hotspot search" data-action="search" aria-label="Search" title="Search"></button>
    <button class="hotspot account" data-action="account" aria-label="Account" title="Account"></button>
    <button class="hotspot cart-icon" data-action="cart" aria-label="Open basket" title="Open basket"><span id="cartCount" class="cart-count">0</span></button>
    <button class="hotspot whatsapp" data-action="whatsapp" aria-label="Contact us on WhatsApp"></button>
    <button class="hotspot category cat1" data-category="Tufting Gun" aria-label="Tufting Gun category"></button>
    <button class="hotspot category cat2" data-category="Tondeuse / Ciseaux" aria-label="Trimmers and scissors category"></button>
    <button class="hotspot category cat3" data-category="Fils & Accessoires" aria-label="Yarn and accessories category"></button>
    <button class="hotspot category cat4" data-category="Designs & Posters" aria-label="Designs and posters category"></button>
    <button class="hotspot category cat5" data-category="Sur mesure" aria-label="Custom designs category"></button>
    <button class="hotspot promo promo1" data-action="shop" aria-label="Open boutique"></button>
    <button class="hotspot promo promo2" data-action="custom" aria-label="Custom creations"></button>
    <button class="hotspot promo promo3" data-action="projects" aria-label="Latest projects"></button>
    <button class="hotspot footer-contact" data-action="whatsapp" aria-label="Contact us"></button>
  </main>

  <dialog id="shopDialog" class="dialog shop-dialog">
    <div class="dialog-head"><div><p class="eyebrow" data-i18n="eyebrow">La petite boutique</p><h2 id="dialogTitle">Boutique</h2></div><button class="close" data-close="shopDialog" aria-label="Close">×</button></div>
    <div id="productGrid" class="product-grid"></div>
  </dialog>
  <dialog id="detailDialog" class="dialog detail-dialog">
    <button class="close floating-close" data-close="detailDialog" aria-label="Close">×</button>
    <div id="detailContent" class="detail-content"></div>
  </dialog>
  <dialog id="cartDialog" class="dialog cart-dialog">
    <div class="dialog-head"><div><p class="eyebrow" data-i18n="yourOrder">Votre commande</p><h2 data-i18n="basket">Panier</h2></div><button class="close" data-close="cartDialog" aria-label="Close">×</button></div>
    <div id="cartItems"></div><div class="cart-total"><span data-i18n="estimatedTotal">Total estimé</span><strong id="cartTotal">0 DH</strong></div>
    <button id="checkout" class="primary" data-i18n="checkout">Commander via WhatsApp</button>
    <p class="small-note" data-i18n="checkoutNote">La commande sera envoyée dans WhatsApp pour confirmation.</p>
  </dialog>
  <dialog id="searchDialog" class="dialog small-dialog">
    <button class="close floating-close" data-close="searchDialog" aria-label="Close">×</button><h2 data-i18n="searchTitle">Chercher dans la boutique</h2><input id="searchInput" type="search" placeholder="Ex. laine, tufting gun…"><button id="searchSubmit" class="primary" data-i18n="searchButton">Rechercher</button>
  </dialog>
  <dialog id="infoDialog" class="dialog small-dialog">
    <button class="close floating-close" data-close="infoDialog" aria-label="Close">×</button><h2 id="infoTitle">Tuft & Create</h2><p id="infoText"></p><button class="primary" data-close="infoDialog" data-i18n="close">Fermer</button>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
